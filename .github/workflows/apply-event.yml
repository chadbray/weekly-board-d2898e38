name: Apply calendar event

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Penelope event
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          event = "ONCE.push({date:'2026-09-30',title:'No school or OGS',person:'penelope'});"
          marker = "if(!await unlockCalendar())return;"
          if event not in s:
              if marker not in s:
                  raise SystemExit('Dashboard unlock marker not found')
              p.write_text(s.replace(marker, marker + event, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Penelope no school event for 30 Sep 2026"
          git push
