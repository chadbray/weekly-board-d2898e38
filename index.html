<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f6f1">
  <title>Private Family Dashboard</title>
  <style>
    :root{--ink:#183934;--muted:#71827e;--paper:#f5f6f1;--line:#dde5df;--white:#fff;--orange:#e66746}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}button{font:inherit}main{max-width:1180px;margin:auto;padding:22px 15px 64px}.eyebrow{margin:0 0 6px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.14em}h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.04em}.range{margin:9px 0 0;color:var(--muted);font-weight:650}.legend{display:flex;gap:7px;overflow:auto;padding:12px 1px 13px;scrollbar-width:none}.legend span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.legend i{width:9px;height:9px;border-radius:50%}.nav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;margin:2px 0 12px}.nav button{height:39px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:800}.week{display:grid;gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day.weekend{background:#f0f2ed}.day.holiday{background:#e7ebe5;border-color:#cfd8d0}.day.today{border-color:#ef927b;box-shadow:0 0 0 2px #e6674614}.dayhead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid #dfe6e0}.dayhead span{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted)}.dayhead strong{font-size:23px}.holiday-label{margin-left:auto;text-align:right;color:#526a64;font-size:10px;line-height:1.25}.holiday-label b{font-size:11px}.weather{margin-left:auto;display:flex;align-items:center;gap:5px;color:#455d58;font-size:12px;font-weight:850;white-space:nowrap}.holiday-label+.weather{margin-left:6px}.events{padding:7px}.empty{margin:8px;color:#929f9b;font-size:13px}.eventpair{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}.event{border-left:6px solid;border-radius:11px;padding:10px 11px;margin:6px 0}.eventpair .event{height:calc(100% - 12px)}.linked{position:relative}.linked:before{content:'↔';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:#6f817d}.eventtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.type{font-size:11px}.event h3{font-size:15px;margin:0}.event p{margin:4px 0 0;color:#5e716d;font-size:12px}.time{font-weight:800!important;color:#334f49!important}.time em{font-style:normal;font-size:10px;background:#fff9;border-radius:6px;padding:3px 5px;margin-left:5px}.tbc{color:#a06b15!important}.footer{text-align:center;color:#93a19e;font-size:12px;margin-top:16px}}
    :root{--ink:#254B49;--muted:#708785;--paper:#FFF8EE;--line:#E6DDD0;--white:#FFFEFA;--orange:#E9795F}
    body{background:var(--paper)}
    
    .nav button,.day{box-shadow:0 5px 18px #8E76520A}
    .day.weekend{background:#F5EDE2}
    .day.holiday{background:#EDE8DC;border-color:#DAD0BF}
    .day.today{border-color:#EC927D;box-shadow:0 0 0 2px #E9795F18,0 6px 20px #8E76520D}
    .dayhead{border-bottom-color:#E8E0D5}
    .holiday-label{color:#63736A}.weather{color:#516B68}.empty{color:#96A29E}.time{color:#3E5D58!important}.tbc{color:#A56D2E!important}
    :root{--ink:#304D5E;--muted:#748795;--paper:#F2F7FC;--line:#D9E4ED;--white:#FCFEFF;--orange:#7B72B4}
    
    .day.weekend{background:#EAF4EF}
    .day.holiday{background:#EEEAF7;border-color:#D8D0E8}
    .day.today{border-color:#8DA9D0;box-shadow:0 0 0 2px #8DA9D026,0 6px 20px #6484A00D}
    .dayhead{border-bottom-color:#DDE8EF}.holiday-label{color:#756A91}.weather{color:#557184}.tbc{color:#6F669A!important}.event-note{color:#71818A!important;font-size:11px!important;font-weight:500!important;line-height:1.35}
    .event{border-left-width:7px}
  
    [hidden]{display:none!important}
    .unlock-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#F2F7FC,#EEEAF7);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:#304D5E}
    .unlock-card{width:min(100%,430px);background:#FCFEFF;border:1px solid #D9E4ED;border-radius:22px;padding:30px;box-shadow:0 18px 55px #425A7020;text-align:center}
    .unlock-icon{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:#EAE7F6;font-size:26px}
    .unlock-card h1{font-size:27px;margin:0 0 8px;letter-spacing:-.035em}.unlock-card p{margin:0 0 20px;color:#748795;line-height:1.5;font-size:14px}
    .unlock-form{display:grid;gap:10px}.unlock-form input{width:100%;border:1px solid #CBD9E4;border-radius:12px;padding:12px 13px;font:inherit;color:#304D5E;background:#fff}.unlock-form button{border:0;border-radius:12px;padding:12px 14px;background:#7B72B4;color:#fff;font:inherit;font-weight:850;cursor:pointer}
    .unlock-error{margin:12px 0 0!important;color:#A84747!important;font-weight:750}


    html{scroll-behavior:smooth;scroll-padding-top:80px}
    .page-nav{position:sticky;top:0;z-index:2;display:flex;gap:10px;background:var(--paper);padding:10px 0 14px}
    .page-nav a,.page-link{display:inline-block;color:var(--ink);background:white;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;font-weight:800}
    .page-nav a{flex:1;text-align:center}.page-link{margin:18px 0}
    button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
    #month-page{margin-top:44px;border-top:2px solid var(--line);padding-top:28px}
    #month-heading{font-size:clamp(22px,5vw,30px);margin:0;text-align:center}.month-nav{align-items:center}.month-reset{display:block;margin:0 auto 12px;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;font-weight:750}.month-help{color:var(--muted);font-size:14px}
    .month-grid,.month-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .month-weekdays{text-align:center;font-size:12px;font-weight:800;margin-bottom:8px}
    .month-date{font:inherit;color:var(--ink);min-width:0;min-height:116px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px;background:white;cursor:pointer;overflow-wrap:anywhere}
    .month-date.weekend{background:#EAF4EF}.month-date.holiday{background:#EEEAF7}
    .month-date.outside{background:transparent;color:var(--muted)}
    .month-date.today .date-number{background:var(--ink);color:white;border-radius:50%}
    .date-number{display:inline-grid;place-items:center;min-width:26px;height:26px;font-weight:850}
    .month-date[aria-pressed="true"]{outline:2px solid var(--orange);outline-offset:-2px}
    .month-count{display:block;font-size:11px;color:var(--muted);margin-top:5px}
    .month-preview{display:block;font-size:11px;line-height:1.35;margin-top:6px}
    .month-preview span{display:block;border-left:3px solid;padding-left:4px;margin-top:4px}
    #month-agenda{margin-top:20px}#month-agenda h3.selected-heading{font-size:19px;margin:0 0 12px}
    @media(max-width:600px){.month-grid,.month-weekdays{gap:3px}.month-date{min-height:76px;padding:4px 2px;text-align:center;border-radius:8px}.month-preview{display:none}.month-count{font-size:10px}.month-date .date-number{min-width:25px}main{padding-left:10px;padding-right:10px}.event h3{overflow-wrap:anywhere}.nav button{min-height:44px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body><main id="dashboard">
  <nav class="page-nav" aria-label="Calendar pages"><a href="#week-page">1 · Week</a><a href="#month-page">2 · Month ↓</a></nav>
  <section id="week-page" aria-label="Week view"><header><p class="eyebrow">FAMILY DASHBOARD</p><h1>Our week</h1><p class="range" id="range"></p></header>
  <section class="legend" id="legend"></section>
  <nav class="nav"><button id="prev" aria-label="Previous day">‹</button><button id="today">Today + 6 days</button><button id="next" aria-label="Next day">›</button></nav>
  <section class="week" id="week"></section>
  <a class="page-link" href="#month-page">Go to month view ↓</a>
  </section>
  <section id="month-page" aria-labelledby="month-heading">
    <p class="eyebrow">PAGE 2 · MONTH VIEW</p>
    <nav class="nav month-nav" aria-label="Month navigation"><button id="month-prev" aria-label="Previous month">‹</button><h2 id="month-heading" aria-live="polite"></h2><button id="month-next" aria-label="Next month">›</button></nav>
    <button id="month-today" class="month-reset" hidden>Back to current month</button>
    <p class="month-help">Select a date to see all its events below.</p>
    <div class="month-weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="month-grid" id="month-grid" aria-label="Month dates"></div>
    <section id="month-agenda" aria-label="Selected date events" aria-live="polite"></section>
    <a class="page-link" href="#week-page">↑ Back to week view</a>
  </section>
  <p class="footer">Family calendar · Refreshes when reopened</p>
</main><script src="secure-calendar.js?v=20261014-5"></script><script>
(async()=>{
let WEATHER={};
async function refreshWeather(){try{WEATHER=await getWeather();render();renderMonth()}catch(error){console.warn('Weather unavailable')}}
let dayOffset=0;const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
function pageStart(){let d=currentDay();d.setDate(d.getDate()+dayOffset);return d}
document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
function render(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;let today=iso(new Date()),prev=document.querySelector('#prev'),centre=document.querySelector('#today');prev.disabled=false;prev.style.opacity='1';centre.textContent=dayOffset===0?'Today + 6 days':`${anchor.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}`;document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);let list=itemsFor(d),holiday=holidayFor(d),weather=WEATHER[iso(d)],weekend=d.getDay()===0||d.getDay()===6;return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${iso(d)===today?'today':''}"><div class="dayhead"><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong>${d.getDate()}</strong>${holiday?`<small class="holiday-label"><b>${holiday}</b><br>Public holiday</small>`:''}${weather?`<small class="weather">${weather.icon} ${weather.high}°/${weather.low}°</small>`:''}</div><div class="events">${list.length?list.map(e=>{let p=PEOPLE[e.person];let badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';let main=`<div class="event" style="border-color:${p.color};background:${p.color}2B"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3>${e.start?`<p class="time">${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` <em>${dur(e.start,e.end)}</em>`:''}</p>`:!e.birthday?`<p class="time tbc">${e.timeLabel||'Time TBC'}</p>`:''}${e.note?`<p class="event-note">🎒 ${e.note}</p>`:''}</div>`;if(!e.responsible)return main;let adult=PEOPLE[e.responsible.toLowerCase()];return `<div class="eventpair">${main}<div class="event linked" style="border-color:${adult.color};background:${adult.color}22"><div class="eventtop"><span class="person" style="color:${adult.color}">${adult.name}</span><span class="type">Taking</span></div><h3>${e.linkedTitle||e.title}</h3><p class="time ${e.start?'':'tbc'}">${e.start?`${e.start}${e.end?'–'+e.end:''}`:(e.timeLabel||'Time TBC')}</p></div></div>`}).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
document.querySelector('#prev').onclick=()=>{dayOffset--;render()};document.querySelector('#next').onclick=()=>{dayOffset++;render()};document.querySelector('#today').onclick=()=>{dayOffset=0;render()};render();

const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Calendar dates are local civil dates, as in the weekly renderer; noon avoids DST midnight edges.
let monthAnchor=currentDay();monthAnchor.setDate(1);
let selectedDate=currentDay();
function monthDayCard(d){
  let list=itemsFor(d),holiday=holidayFor(d),weather=WEATHER[iso(d)],weekend=d.getDay()===0||d.getDay()===6,today=iso(new Date());
  return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${iso(d)===today?'today':''}"><div class="dayhead"><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong>${d.getDate()}</strong>${holiday?`<small class="holiday-label"><b>${holiday}</b><br>Public holiday</small>`:''}${weather?`<small class="weather">${weather.icon} ${weather.high}°/${weather.low}°</small>`:''}</div><div class="events">${list.length?list.map(e=>{let p=PEOPLE[e.person];let badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';let main=`<div class="event" style="border-color:${p.color};background:${p.color}2B"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3>${e.start?`<p class="time">${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` <em>${dur(e.start,e.end)}</em>`:''}</p>`:!e.birthday?`<p class="time tbc">${e.timeLabel||'Time TBC'}</p>`:''}${e.note?`<p class="event-note">🎒 ${e.note}</p>`:''}</div>`;if(!e.responsible)return main;let adult=PEOPLE[e.responsible.toLowerCase()];return `<div class="eventpair">${main}<div class="event linked" style="border-color:${adult.color};background:${adult.color}22"><div class="eventtop"><span class="person" style="color:${adult.color}">${adult.name}</span><span class="type">Taking</span></div><h3>${e.linkedTitle||e.title}</h3><p class="time ${e.start?'':'tbc'}">${e.start?`${e.start}${e.end?'–'+e.end:''}`:(e.timeLabel||'Time TBC')}</p></div></div>`}).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`
}
function renderMonth(){
  const label=monthAnchor.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  document.querySelector('#month-heading').textContent=label;
  const now=currentDay();
  document.querySelector('#month-today').hidden=monthAnchor.getFullYear()===now.getFullYear()&&monthAnchor.getMonth()===now.getMonth();
  const first=new Date(monthAnchor);first.setDate(1-((first.getDay()+6)%7));
  const days=new Date(monthAnchor.getFullYear(),monthAnchor.getMonth()+1,0,12).getDate();
  const cells=Math.ceil((((monthAnchor.getDay()+6)%7)+days)/7)*7;
  const today=iso(currentDay());
  document.querySelector('#month-grid').innerHTML=Array.from({length:cells},(_,i)=>{
    const d=new Date(first);d.setDate(d.getDate()+i);
    const key=iso(d),list=itemsFor(d),outside=d.getMonth()!==monthAnchor.getMonth(),holiday=holidayFor(d);
    const dateLabel=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const count=list.length;
    return `<button type="button" class="month-date ${outside?'outside ':''}${d.getDay()===0||d.getDay()===6?'weekend ':''}${holiday?'holiday ':''}${key===today?'today':''}" data-date="${key}" aria-pressed="${key===iso(selectedDate)}" ${key===today?'aria-current="date"':''} aria-label="${escapeText(dateLabel+(holiday?', '+holiday:'')+', '+count+(count===1?' event':' events'))}"><span class="date-number">${d.getDate()}</span><span class="month-count">${count?count+(count===1?' event':' events'):'—'}</span><span class="month-preview">${list.slice(0,2).map(e=>`<span style="border-color:${PEOPLE[e.person].color}">${escapeText((e.start?e.start+' ':'')+e.title)}</span>`).join('')}${count>2?`<span>+${count-2} more</span>`:''}</span></button>`;
  }).join('');
  document.querySelector('#month-agenda').innerHTML='<h3 class="selected-heading">'+selectedDate.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</h3>'+monthDayCard(selectedDate);
}
function moveMonth(step){
  monthAnchor.setDate(1);monthAnchor.setMonth(monthAnchor.getMonth()+step);
  selectedDate=new Date(monthAnchor);renderMonth();
}
document.querySelector('#month-prev').onclick=()=>moveMonth(-1);
document.querySelector('#month-next').onclick=()=>moveMonth(1);
document.querySelector('#month-today').onclick=()=>{selectedDate=currentDay();monthAnchor=currentDay();monthAnchor.setDate(1);renderMonth()};
document.querySelector('#month-grid').onclick=event=>{
  const button=event.target.closest('button[data-date]');if(!button)return;
  const [year,month,day]=button.dataset.date.split('-').map(Number);
  selectedDate=new Date(year,month-1,day,12);
  monthAnchor=new Date(year,month-1,1,12);renderMonth();
  document.querySelector(`#month-grid button[data-date="${iso(selectedDate)}"]`).focus({preventScroll:true});
};
renderMonth();

scheduleDashboardRefresh();
refreshWeather();
refreshWhenVisible();
})();
</script></body></html>
